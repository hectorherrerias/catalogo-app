services:
  catalogo-app:
    build: .
    image: catalogo-app:latest
    container_name: catalogo-app
    restart: unless-stopped
    ports:
      # Puerto del host configurable: APP_PORT=8010 docker compose up -d
      - "${APP_PORT:-8010}:8000"
    volumes:
      # Base de datos SQLite + fotos subidas, persistentes en el host
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/catalog.db
      - TZ=Europe/Madrid
